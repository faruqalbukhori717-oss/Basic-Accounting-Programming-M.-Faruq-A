<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Report Styled</title>
    <link rel="stylesheet" href="report_styles.css">
</head>
<body>
    <h1>Financial Transaction Report</h1>

    <h2>General Journal</h2>
    <table id="general-journal-table">
        <thead>
            <tr>
                <th>Date</th>
                <th>Account Description</th>
                <th>Ref</th>
                <th>Debit</th>
                <th>Credit</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>2025-01-02</td>
                <td>Cash</td>
                <td>101</td>
                <td>15,000,000</td>
                <td>-</td>
            </tr>
            <tr>
                <td>2025-01-02</td>
                <td>Capital</td>
                <td>301</td>
                <td>-</td>
                <td>15,000,000</td>
            </tr>
        </tbody>
        <tfoot>
            <tr class="highlight-row">
                <td colspan="3">Total</td>
                <td>15,000,000</td>
                <td>15,000,000</td>
            </tr>
        </tfoot>
    </table>

    <h2>Cash Movement</h2>
    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Description</th>
                <th>Amount</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>2025-01-02</td>
                <td>Initial Deposit</td>
                <td>15,000,000</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
